# Nginx configuration for Software Hub

# Log format: standard combined with response time
log_format shub '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" rt=$request_time';

# Additional MIME types beyond nginx defaults (installer packages, YAML)
types {
    application/vnd.android.package-archive apk;
    application/x-apple-diskimage           dmg;
    application/x-newton-compatible-pkg     pkg;
    application/x-msdownload                exe;
    image/svg+xml                           svg svgz;
    font/woff2                              woff2;
    application/yaml                        yaml yml;
}

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log shub;
    error_log  /var/log/nginx/error.log warn;

    # Larger uploads / big installer files
    client_max_body_size 10G;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    # Gzip for text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json application/yaml image/svg+xml;

    # No caching for HTML / JS / CSS / YAML so deploys take effect immediately
    location ~* \.(html|js|css|yaml|yml)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires -1;
    }

    # Long-cache fonts and icons (they're immutable per deploy)
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Force download for installer files (browser triggers Save dialog)
    location /downloads/ {
        add_header Content-Disposition 'attachment' always;
        # Enable resumable downloads
        add_header Accept-Ranges bytes always;
    }

    # SPA-style: return index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
