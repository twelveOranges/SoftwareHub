services:
  software-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: software-hub:latest
    container_name: software-hub
    restart: unless-stopped
    ports:
      - "8080:80"           # host:container — change 8080 if in use
    volumes:
      # Mount downloads folder so you can add / replace installers
      # without rebuilding the image.
      - ./downloads:/usr/share/nginx/html/downloads:ro
      # Also expose icons for easy hot-swap of app icons
      - ./icons:/usr/share/nginx/html/icons:ro
      # Live-edit the catalog data without rebuild
      - ./data:/usr/share/nginx/html/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
