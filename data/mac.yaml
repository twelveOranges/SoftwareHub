# Mac software catalog.
# Schema per entry:
#   name         : Display name (required)
#   icon         : Icon path or emoji (required)
#   desc         : Short one-line description
#   category     : design|dev|office|video|system|browser|chat|life|game
#   essential    : true if this belongs to "装机必备"
#   note         : Personal note (serial numbers, activation tips, etc.)
#   versions     : List; first entry is the recommended version
#     - version      : Version string (e.g. "2024", "1.85")
#       downloadUrl  : Path to installer file
#       note         : (optional) version-specific note
#   attachments  : (optional) extras bundled with the app
#     - name         : Attachment name
#       desc         : (optional) description
#       downloadUrl  : Path to attachment file
#       installPath  : (optional) suggested install location
#
# NOTE: File sizes and modification dates are auto-detected at runtime
#       from the file server (Content-Length + Last-Modified headers).
#       Do NOT hand-maintain size/releaseDate here.

- name: Photoshop
  icon: icons/mac/photoshop.png
  desc: 专业图像处理软件
  category: design
  essential: true
  note: "序列号: 见 1Password「Adobe」条目"
  versions:
    - version: "2024"
      downloadUrl: /downloads/mac/photoshop-2024.dmg
    - version: "2023"
      downloadUrl: /downloads/mac/photoshop-2023.dmg
      note: 兼容旧插件
    - version: "2022"
      downloadUrl: /downloads/mac/photoshop-2022.dmg
  attachments:
    - name: 常用滤镜包
      desc: Nik Collection + Camera Raw 预设
      downloadUrl: /downloads/mac/extras/ps-filters.zip
      installPath: ~/Library/Application Support/Adobe/Plug-ins
    - name: 字体包
      desc: 设计常用中英文字体 200+
      downloadUrl: /downloads/mac/extras/ps-fonts.zip
      installPath: ~/Library/Fonts

